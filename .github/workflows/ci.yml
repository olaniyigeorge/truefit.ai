name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python lint, format, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/truefit/backend/requirements.txt

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          # soro[all] pulls the local speech stack (faster-whisper, Piper).
          # Tests skip those; soro[dev] covers everything else they import.
          grep -v '^-e ' examples/truefit/backend/requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
          python -m pip install -e "packages/soro[dev]"

      - name: Lint
        run: ruff check packages/soro examples/truefit/backend

      - name: Check formatting
        run: ruff format --check packages/soro examples/truefit/backend

      - name: Test Soro
        working-directory: packages/soro
        run: python -m pytest tests -q

      - name: Test TrueFit backend
        working-directory: examples/truefit/backend
        env:
          ENV: test
        run: |
          cp env.example .env
          python -m pytest tests -q

  frontend:
    name: Frontend lint and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/truefit/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: examples/truefit/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc -b --pretty false

  deploy:
    name: Deploy to GCP
    needs: [python, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

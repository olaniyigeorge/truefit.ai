[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soro"
version = "0.1.0"
description = "Model-agnostic realtime voice agent infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
# Install only the providers you use, e.g. pip install "soro[gemini]".
gemini = ["google-genai>=1.65", "websockets>=13"]
openai = ["websockets>=13", "av>=12"]
webrtc = ["aiortc>=1.9", "av>=12"]
vad = ["onnxruntime>=1.17", "numpy>=1.24"]
openapi = ["httpx>=0.27", "pyyaml>=6"]
mcp = ["mcp>=1.0"]
# Includes onnxruntime: the composed adapter owns turn-taking and defaults to Silero.
composed = ["faster-whisper>=1.0", "piper-tts>=1.2", "httpx>=0.27", "numpy>=1.24", "onnxruntime>=1.17"]
all = ["soro[gemini,openai,webrtc,vad,openapi,mcp,composed]"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "soro[all]"]

[tool.hatch.build.targets.wheel]
packages = ["src/soro"]

[tool.hatch.build]
# The bundled Silero VAD model is a binary that VCS-based file selection would
# otherwise skip; list it as an artifact so sdists and wheels always carry it.
artifacts = ["src/soro/audio/assets/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["unit: no network, no provider"]
